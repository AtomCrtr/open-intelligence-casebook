<svg xmlns="http://www.w3.org/2000/svg" width="960" height="798" viewBox="0 0 960 798" role="img" aria-labelledby="t d" font-family="Noto Sans, Arial, sans-serif">
<title id="t">Case 03 : ce qui est établi, et avec quelle confiance</title>
<desc id="d">12 affirmations publiques tirées des cinq jugements clés, chacune avec son niveau de confiance écrit en toutes lettres.</desc>
<rect width="960" height="798" fill="#ffffff"/>
<text x="24" y="38" font-size="18" font-weight="700" fill="#1d2a30">Ce qui est établi, et avec quelle confiance</text>
<text x="24" y="62" font-size="12" fill="#4b5b63">Confiance de l'analyste, portant sur l'affirmation et non sur la fiabilité d'une source. Analyse OSINT — non destinée à la navigation.</text>
<text x="24" y="78" font-size="12" fill="#4b5b63">« non établi » : question sur laquelle les sources ne permettent qu'une confiance faible.</text>
<text x="858" y="82" font-size="11" text-anchor="middle" fill="#4b5b63">confiance</text>
<line x1="24" y1="96" x2="936" y2="96" stroke="#d5dde1"/>
<text x="24" y="122" font-size="13" font-weight="700" fill="#33424a">KJ-01</text>
<text x="24" y="138" font-size="10" fill="#4b5b63">C3-01</text>
<text x="104" y="120" font-size="13" fill="#1d2a30">Les indicateurs de dégradations GNSS et les déclarations institutionnelles décrivent une</text>
<text x="104" y="138" font-size="13" fill="#1d2a30">hausse du signal détecté entre 2022 et la mi-2025, au niveau mondial et dans le foyer</text>
<text x="104" y="156" font-size="13" fill="#1d2a30">balte.</text>
<rect x="780" y="106" width="156" height="24" rx="12" fill="#1a535a" stroke="#33424a" stroke-width="0"/>
<text x="858" y="123" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Élevée</text>
<line x1="24" y1="166" x2="936" y2="166" stroke="#d5dde1"/>
<text x="24" y="192" font-size="13" font-weight="700" fill="#33424a">KJ-01</text>
<text x="24" y="208" font-size="10" fill="#4b5b63">C3-12</text>
<text x="104" y="190" font-size="13" fill="#1d2a30">Les déclarations institutionnelles décrivent aussi une hausse dans l’espace aérien</text>
<text x="104" y="208" font-size="13" fill="#1d2a30">européen ; les séries ne séparent pas le phénomène et sa détection.</text>
<rect x="780" y="176" width="156" height="24" rx="12" fill="#3d7c84" stroke="#33424a" stroke-width="0"/>
<text x="858" y="193" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Modérée</text>
<line x1="24" y1="218" x2="936" y2="218" stroke="#d5dde1"/>
<text x="24" y="244" font-size="13" font-weight="700" fill="#33424a">KJ-01</text>
<text x="24" y="260" font-size="10" fill="#4b5b63">C3-02</text>
<text x="104" y="242" font-size="13" fill="#1d2a30">Le sens de l'évolution après la mi-2025 : les institutions décrivent une persistance,</text>
<text x="104" y="260" font-size="13" fill="#1d2a30">une baisse locale est documentée en Pologne.</text>
<rect x="780" y="228" width="156" height="24" rx="12" fill="#ffffff" stroke="#33424a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="858" y="245" font-size="12" font-weight="700" text-anchor="middle" fill="#33424a">non établi</text>
<line x1="24" y1="270" x2="936" y2="270" stroke="#d5dde1"/>
<text x="24" y="296" font-size="13" font-weight="700" fill="#33424a">KJ-02</text>
<text x="24" y="312" font-size="10" fill="#4b5b63">C3-03</text>
<text x="104" y="294" font-size="13" fill="#1d2a30">La dégradation se concentre de 2024 à octobre 2026 sur deux foyers : Baltique et Nord-</text>
<text x="104" y="312" font-size="13" fill="#1d2a30">Est ; mer Noire et Méditerranée orientale.</text>
<rect x="780" y="280" width="156" height="24" rx="12" fill="#1a535a" stroke="#33424a" stroke-width="0"/>
<text x="858" y="297" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Élevée</text>
<line x1="24" y1="322" x2="936" y2="322" stroke="#d5dde1"/>
<text x="24" y="348" font-size="13" font-weight="700" fill="#33424a">KJ-02</text>
<text x="24" y="364" font-size="10" fill="#4b5b63">C3-04</text>
<text x="104" y="346" font-size="13" fill="#1d2a30">Le classement fin entre FIR et l'apparition de nouveaux foyers (un rang ne mesure pas</text>
<text x="104" y="364" font-size="13" fill="#1d2a30">une intensité).</text>
<rect x="780" y="332" width="156" height="24" rx="12" fill="#ffffff" stroke="#33424a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="858" y="349" font-size="12" font-weight="700" text-anchor="middle" fill="#33424a">non établi</text>
<line x1="24" y1="374" x2="936" y2="374" stroke="#d5dde1"/>
<text x="24" y="400" font-size="13" font-weight="700" fill="#33424a">KJ-03</text>
<text x="24" y="416" font-size="10" fill="#4b5b63">C3-05</text>
<text x="104" y="398" font-size="13" fill="#1d2a30">Des interférences réelles sont documentées sur certains événements ; une explication</text>
<text x="104" y="416" font-size="13" fill="#1d2a30">exclusivement fondée sur des artefacts ne couvre pas ces preuves.</text>
<rect x="780" y="384" width="156" height="24" rx="12" fill="#1a535a" stroke="#33424a" stroke-width="0"/>
<text x="858" y="401" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Élevée</text>
<line x1="24" y1="426" x2="936" y2="426" stroke="#d5dde1"/>
<text x="24" y="452" font-size="13" font-weight="700" fill="#33424a">KJ-03</text>
<text x="24" y="468" font-size="10" fill="#4b5b63">C3-06</text>
<text x="104" y="450" font-size="13" fill="#1d2a30">La contribution respective des interférences réelles et des changements de détection à</text>
<text x="104" y="468" font-size="13" fill="#1d2a30">la hausse des indicateurs n’est pas établie ; les taux normalisés ne suffisent pas à les</text>
<text x="104" y="486" font-size="13" fill="#1d2a30">départager.</text>
<rect x="780" y="436" width="156" height="24" rx="12" fill="#ffffff" stroke="#33424a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="858" y="453" font-size="12" font-weight="700" text-anchor="middle" fill="#33424a">non établi</text>
<line x1="24" y1="496" x2="936" y2="496" stroke="#d5dde1"/>
<text x="24" y="522" font-size="13" font-weight="700" fill="#33424a">KJ-03</text>
<text x="24" y="538" font-size="10" fill="#4b5b63">C3-07</text>
<text x="104" y="520" font-size="13" fill="#1d2a30">Les attributions citées (UIT, Conseil de l'OACI, PANSA, IATA) sont rapportées telles</text>
<text x="104" y="538" font-size="13" fill="#1d2a30">quelles ; le projet ne les requalifie pas.</text>
<rect x="780" y="506" width="156" height="24" rx="12" fill="#ffffff" stroke="#33424a" stroke-width="1"/>
<text x="858" y="523" font-size="12" font-weight="700" text-anchor="middle" fill="#33424a">rapportée, non jugée</text>
<line x1="24" y1="548" x2="936" y2="548" stroke="#d5dde1"/>
<text x="24" y="574" font-size="13" font-weight="700" fill="#33424a">KJ-04</text>
<text x="24" y="590" font-size="10" fill="#4b5b63">C3-08</text>
<text x="104" y="572" font-size="13" fill="#1d2a30">Les conséquences opérationnelles sont réelles : déroutements, fausses alertes TAWS et</text>
<text x="104" y="590" font-size="13" fill="#1d2a30">effets importés sont rapportés comme observés ; d'autres effets sont décrits comme</text>
<text x="104" y="608" font-size="13" fill="#1d2a30">possibles.</text>
<rect x="780" y="558" width="156" height="24" rx="12" fill="#1a535a" stroke="#33424a" stroke-width="0"/>
<text x="858" y="575" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Élevée</text>
<line x1="24" y1="618" x2="936" y2="618" stroke="#d5dde1"/>
<text x="24" y="644" font-size="13" font-weight="700" fill="#33424a">KJ-04</text>
<text x="24" y="660" font-size="10" fill="#4b5b63">C3-09</text>
<text x="104" y="642" font-size="13" fill="#1d2a30">La fréquence et la gravité de ces conséquences.</text>
<rect x="780" y="628" width="156" height="24" rx="12" fill="#ffffff" stroke="#33424a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="858" y="645" font-size="12" font-weight="700" text-anchor="middle" fill="#33424a">non établi</text>
<line x1="24" y1="662" x2="936" y2="662" stroke="#d5dde1"/>
<text x="24" y="688" font-size="13" font-weight="700" fill="#33424a">KJ-05</text>
<text x="24" y="704" font-size="10" fill="#4b5b63">C3-10</text>
<text x="104" y="686" font-size="13" fill="#1d2a30">Les comptages bruts d'incidents ne sont pas des indicateurs de tendance.</text>
<rect x="780" y="672" width="156" height="24" rx="12" fill="#1a535a" stroke="#33424a" stroke-width="0"/>
<text x="858" y="689" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Élevée</text>
<line x1="24" y1="706" x2="936" y2="706" stroke="#d5dde1"/>
<text x="24" y="732" font-size="13" font-weight="700" fill="#33424a">KJ-05</text>
<text x="24" y="748" font-size="10" fill="#4b5b63">C3-11</text>
<text x="104" y="730" font-size="13" fill="#1d2a30">Les taux normalisés et l'indicateur EASA par FIR sont utilisables pour la veille, à</text>
<text x="104" y="748" font-size="13" fill="#1d2a30">condition d'en afficher les biais.</text>
<rect x="780" y="716" width="156" height="24" rx="12" fill="#3d7c84" stroke="#33424a" stroke-width="0"/>
<text x="858" y="733" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Modérée</text>
<line x1="24" y1="758" x2="936" y2="758" stroke="#d5dde1"/>
<text x="24" y="784" font-size="11" fill="#4b5b63">Source : jugements clés du Case 03 (key-judgments.md). Affirmations C3-01 à C3-12 et leurs preuves : evidence-map.md ; sources et lignées : provenance.csv.</text>
</svg>
