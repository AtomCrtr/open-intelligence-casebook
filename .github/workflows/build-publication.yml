name: Build public reports

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - 'README.md'
      - 'cases/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/build-publication.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-report-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Clone repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Restore publication sources when bootstrapping
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          if compgen -G '.bootstrap/part*' > /dev/null; then
            cat .bootstrap/part* | tr -d '\n' | base64 --decode > /tmp/open-intelligence-casebook.tgz
            echo '33f3e67bdb7c123235062edfda1dbda964bbecf00add1b1dfdba77332758e15f  /tmp/open-intelligence-casebook.tgz' | sha256sum -c -
            tar -xzf /tmp/open-intelligence-casebook.tgz -C .
            rm -rf .bootstrap
            rm -rf docs/superpowers
          fi

      - name: Install document toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc ghostscript fonts-noto-core
          python -m pip install --disable-pip-version-check \
            matplotlib==3.10.8 \
            pymupdf==1.26.7 \
            pytest==8.4.1 \
            weasyprint==68.0

      - name: Apply reproducibility hardening
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -f tools/apply_reproducibility_fix.py ]; then
            python tools/apply_reproducibility_fix.py
          fi

      - name: Apply pending audit improvements
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -f tools/apply_audit_improvements.py ]; then
            python tools/apply_audit_improvements.py pre
          fi

      - name: Build and verify publication
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python tools/build_publication.py

      # Bootstrap restoration supplies source-state figures. Build before
      # integrity contracts so hashes always describe generated artifacts.
      - name: Verify editorial and provenance contracts
        shell: bash
        working-directory: repo
        run: python -m pytest tests -q

      - name: Finalize audit improvements
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          if [ -f tools/apply_audit_improvements.py ]; then
            python tools/apply_audit_improvements.py post
          fi

      - name: Verify byte-for-byte reproducibility
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          root = Path('.')
          targets = sorted(
              list((root/'cases/case-01-titanium/figures').glob('*.svg')) +
              list((root/'cases/case-02-portal-kombat/figures').glob('*.svg')) +
              [root/'cases/case-01-titanium/report.pdf', root/'cases/case-02-portal-kombat/report.pdf', root/'publication/checksums.sha256']
          )
          def digest(p): return sha256(p.read_bytes()).hexdigest()
          Path('/tmp/repro-first.txt').write_text('\n'.join(f'{digest(p)}  {p.as_posix()}' for p in targets) + '\n')
          PY
          python tools/build_publication.py >/tmp/repro-second-build.log
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          root = Path('.')
          targets = sorted(
              list((root/'cases/case-01-titanium/figures').glob('*.svg')) +
              list((root/'cases/case-02-portal-kombat/figures').glob('*.svg')) +
              [root/'cases/case-01-titanium/report.pdf', root/'cases/case-02-portal-kombat/report.pdf', root/'publication/checksums.sha256']
          )
          def digest(p): return sha256(p.read_bytes()).hexdigest()
          Path('/tmp/repro-second.txt').write_text('\n'.join(f'{digest(p)}  {p.as_posix()}' for p in targets) + '\n')
          PY
          diff -u /tmp/repro-first.txt /tmp/repro-second.txt
          echo 'BYTE_REPRODUCIBILITY=PASS'

      - name: Render visual QA contact sheets
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p /tmp/publication-visual-qa
          python - <<'PY'
          import math
          import fitz
          from PIL import Image, ImageDraw

          def contact_sheet(pdf_path: str, out_path: str) -> None:
              doc = fitz.open(pdf_path)
              thumbs = []
              for idx, page in enumerate(doc):
                  pix = page.get_pixmap(matrix=fitz.Matrix(0.32, 0.32), alpha=False)
                  img = Image.frombytes('RGB', [pix.width, pix.height], pix.samples)
                  framed = Image.new('RGB', (img.width, img.height + 24), 'white')
                  framed.paste(img, (0, 24))
                  ImageDraw.Draw(framed).text((6, 5), f'Page {idx + 1}', fill='black')
                  thumbs.append(framed)
              cols = 4
              cell_w = max(i.width for i in thumbs)
              cell_h = max(i.height for i in thumbs)
              rows = math.ceil(len(thumbs) / cols)
              sheet = Image.new('RGB', (cols * cell_w, rows * cell_h), 'white')
              for idx, img in enumerate(thumbs):
                  x = (idx % cols) * cell_w
                  y = (idx // cols) * cell_h
                  sheet.paste(img, (x, y))
              sheet.save(out_path, optimize=True)
              doc.close()

          contact_sheet('cases/case-01-titanium/report.pdf', '/tmp/publication-visual-qa/case-01-contact-sheet.png')
          contact_sheet('cases/case-02-portal-kombat/report.pdf', '/tmp/publication-visual-qa/case-02-contact-sheet.png')
          PY

      - name: Upload visual QA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-pdf-visual-qa
          path: /tmp/publication-visual-qa/*.png
          retention-days: 1
          if-no-files-found: error

      - name: Commit publication package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          # The final build binds checksums to the exact files that are staged.
          python tools/build_publication.py
          python -m pytest tests -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            cases/case-01-titanium/data/key_metrics.csv \
            cases/case-01-titanium/figures/*.svg \
            cases/case-01-titanium/report.pdf \
            cases/case-02-portal-kombat/data/key_metrics.csv \
            cases/case-02-portal-kombat/figures/*.svg \
            cases/case-02-portal-kombat/report.pdf \
            publication/checksums.sha256 \
            publication/public-manifest.csv \
            publication/release-checklist.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'build(publication): deterministic audited reports [skip ci]'
          git push origin HEAD:main
